# attribution-audit - runs on every push to the protected branch of a WORK repository and fails
# (red build + notification) when the commit that landed carries AI attribution or has the vendor
# identity as author or committer. It checks every commit since the one its previous run checked.
# Detection only: it catches a merge message edited in the completion dialog and pushes by people
# with bypass rights. Patterns: tools/attribution-guard/patterns.ere on that branch, embedded default otherwise.
# Copy to the work repository as .azure-pipelines/attribution-audit.yml; setup-azure-devops.sh
# creates the pipeline. Generated by tools/attribution-guard/azure-devops/gen.py; do not edit here.
trigger:
  branches:
    include: [main]
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
- job: attribution_audit
  displayName: attribution-audit
  timeoutInMinutes: 10
  steps:
  - checkout: self
    fetchDepth: 500          # enough history to reach the commit the previous run checked
    fetchTags: false
    persistCredentials: false
  - bash: |
      set -euo pipefail
      export LC_ALL=C
      # The completer can still edit the merge commit message in the completion dialog after every PR
      # check passed, and bypass rights allow direct pushes: check what actually landed. Detection only.
      if git cat-file -e 'HEAD:tools/attribution-guard/patterns.ere' 2>/dev/null; then
        ATTRIB_RE=$(git show 'HEAD:tools/attribution-guard/patterns.ere' | sed -n 1p)
      else
        ATTRIB_RE=$(cat <<'ERE'
      ^[-*>[:space:]]*[[:alnum:]-]+-by[[:space:]]*:[[:space:]]*["'[(*_]*(claude|anthropic)|^[-*>[:space:]]*[[:alnum:]-]+-by[[:space:]]*:.*(@anthropic\.com|[^[:alnum:]](claude|anthropic)([^-[:alnum:]]|$|-(opus|sonnet|haiku|code)))|noreply@anthropic\.com|^[-*>[:space:]]*claude-session[[:space:]]*:|claude\.ai\.?(:[0-9]+)?/((code/)?(sessions?|cse)(_|%5f|/)|share/|chat/|(code/|public/)?artifacts?/)|claude\.site([^[:alnum:]-]|$)|claude\.com/claude-code|(generated|built|written|created|made|assisted|authored|produced|developed|coded|drafted) +(with|by|using|in|via|through) +["'[(*_]*(claude|anthropic)(ai| ai| code|-code|-(opus|sonnet|haiku)[-.[:alnum:]]*)?([^-[:alnum:]]|$)
      ERE
      )
      fi
      ATTRIB_ZW=$'\xe2\x80\x8b|\xe2\x80\x8c|\xe2\x80\x8d|\xe2\x81\xa0|\xef\xbb\xbf'
      export ATTRIB_RE ATTRIB_ZW
      err() { echo "##vso[task.logissue type=error]attribution-audit: $1"; exit 2; }
      printf 'x\n' | awk 'BEGIN { re = tolower(ENVIRON["ATTRIB_RE"]) } { if ($0 ~ re) n++ }' >/dev/null 2>&1 \
        || err "the attribution pattern does not compile."

      # Everything since the commit the previous completed run of this pipeline checked on this branch.
      url="${SYSTEM_COLLECTIONURI%/}/${SYSTEM_TEAMPROJECTID}/_apis/build/builds?definitions=${SYSTEM_DEFINITIONID}&branchName=${BUILD_SOURCEBRANCH}&statusFilter=completed&queryOrder=finishTimeDescending&\$top=1&api-version=7.1"
      prev=$(curl -sS --fail-with-body --retry 3 -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" "$url" \
        | jq -r '.value[0].sourceVersion // empty') || err "could not read the previous run of this pipeline."
      if [[ -z $prev ]]; then
        echo "First run on this branch: checking the latest commit (and a merge's second-parent history)."
        if [[ $(git rev-list --parents -n 1 HEAD | wc -w) -ge 3 ]]; then range=(HEAD^1..HEAD); else range=(-1 HEAD); fi
      elif [[ ! $prev =~ ^[0-9a-f]{40}$ ]]; then
        err "unexpected previous commit id."
      elif git cat-file -e "$prev^{commit}" 2>/dev/null && git merge-base --is-ancestor "$prev" HEAD; then
        range=("$prev..HEAD")
      else
        err "commit ${prev:0:8} from the previous run is not in the fetched history of HEAD (force-push, or more than fetchDepth commits); check the branch by hand."
      fi
      fail=0 n=0
      while IFS= read -r c; do
        n=$((n + 1))
        lines=$(git log -1 --format=%B "$c" | awk 'BEGIN { re = tolower(ENVIRON["ATTRIB_RE"]); zw = ENVIRON["ATTRIB_ZW"] }
          { s = $0; gsub(zw, "", s); if (tolower(s) ~ re) printf "%d ", NR }')
        if [[ -n $lines ]]; then
          echo "##vso[task.logissue type=error]AI attribution landed on $BUILD_SOURCEBRANCHNAME in commit ${c:0:8}, line(s) $lines"; fail=1
        fi
        for who in ae ce; do
          if git log -1 --format="%$who" "$c" | grep -Eiq '@anthropic\.com$'; then
            echo "##vso[task.logissue type=error]commit ${c:0:8} has the vendor identity as $([[ $who == ae ]] && echo author || echo committer)"; fail=1
          fi
        done
      done < <(git rev-list "${range[@]}")
      echo "Checked $n commit(s)."
      [[ $fail -eq 0 ]] || { echo "Revert or rewrite the commit; see docs/ATTRIBUTION.md."; exit 1; }
      echo "No AI attribution in the commits that landed."
    displayName: Check the commits that landed
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)      # reads the previous run of this pipeline
