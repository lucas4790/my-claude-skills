name: Sync upstream skills

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:  # every PR, so `validate-pr` can be a required check on main

permissions:
  contents: write
  pull-requests: write
  statuses: write

# One group per PR branch, one for the scheduled sync: a shared group lets GitHub drop a queued
# PR run when several PRs push at once (only one run may wait per group), which leaves the
# required `validate-pr` check missing on that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  # Human PRs: structural checks, and any high-severity injection pattern in lines
  # added by the PR fails the check (exit 2) so it cannot be merged unnoticed.
  # Sync PRs never reach this job (GITHUB_TOKEN-created PRs don't trigger workflows);
  # the sync job below validates them itself and reports the same status context.
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Runs code from the PR (validate.py, the test suites): read-only token, no stored credentials,
    # so it cannot edit the PR after the attribution check passed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/validate.py --diff "origin/${{ github.base_ref }}"
      - name: Install test tools
        # bats 1.10, pytest 7.4 and yamllint from Ubuntu; shellcheck, pwsh, git, rsync and jq are
        # preinstalled. The pytest suite of the skill-example checker never installs Pester, so it comes first.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats python3-pytest yamllint
          pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck'
      - name: Script tests (bats + pytest)
        env:
          SKILL_EXAMPLES_REQUIRE_TOOLS: "1"  # a missing pwsh, Pester, shellcheck or yamllint fails, never skips
        run: scripts/run-tests.sh
      - name: Skill examples
        # The code blocks of every skill in tests/skill-examples.json, per fence language.
        env:
          SKILL_EXAMPLES_REQUIRE_TOOLS: "1"
        run: scripts/test-skill-examples.sh
      - name: Attribution guard tests
        run: |
          sh tools/attribution-guard/tests/run-tests.sh
          python3 tools/attribution-guard/azure-devops/gen.py --check
          bash tools/attribution-guard/azure-devops/tests/run-tests.sh
          bash tools/attribution-guard/azure-devops/tests/run-dispatch-tests.sh
      - name: Claude Code manifest validation
        # Gated inside the step rather than with a `paths:` trigger filter so the job still
        # reports on every PR (it is a required check on main).
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(plugins/|\.claude-plugin/)'; then
            echo "No changes under plugins/ or .claude-plugin/; skipping manifest validation."
            exit 0
          fi
          curl -fsSL https://claude.ai/install.sh | bash
          "$HOME/.local/bin/claude" plugin validate .

  # Every upstream tier lands as a pull request; nothing is pushed to main by automation.
  # The validator scans only the lines this sync adds and puts its hits in the PR body,
  # so the reviewer sees exactly what changed and what looked instruction-shaped.
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trust: [high, low]
    env:
      BRANCH: sync/${{ matrix.trust }}-trust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # No token in .git/config: the skill-examples step runs unreviewed upstream code. The token
          # exists only in the PR step's environment (see there).
          persist-credentials: false
      # One source that fails (a patch that no longer applies, a vanished path) must not block the
      # PR for all the others: record it and report it at the top of the PR instead.
      - name: Sync
        run: |
          set -o pipefail
          scripts/sync.sh --trust ${{ matrix.trust }} 2>&1 | tee "$RUNNER_TEMP/sync.log" || echo "SYNC_FAILED=1" >> "$GITHUB_ENV"
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats python3-pytest yamllint
      # The same tests as validate-pr, on the synced tree. That tree is upstream content nobody has
      # reviewed yet, which the tests read and the skill examples partly run, so they run as a
      # throwaway user with an empty environment on a copy of the tree: they cannot read the runner
      # user's processes or files, change what later steps run with the token, or write $GITHUB_ENV.
      # Whatever they leave running is killed.
      - name: Tests and skill examples (sandboxed)
        run: |
          set -o pipefail
          sudo useradd --create-home --shell /bin/bash sandbox
          work=$(sudo -u sandbox mktemp -d)
          tar --exclude=.git -cf - . | sudo -u sandbox tar -xf - -C "$work"
          sandboxed() {
            sudo -u sandbox env -i HOME=/home/sandbox PATH=/usr/local/bin:/usr/bin:/bin SKILL_EXAMPLES_REQUIRE_TOOLS=1 "$@"
          }
          # Pester 6 for the sandbox user (the pytest suites never install it themselves)
          sandboxed pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck' \
            2>&1 | tee "$RUNNER_TEMP/tests.log" || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          sandboxed bash "$work/scripts/run-tests.sh" 2>&1 | tee -a "$RUNNER_TEMP/tests.log" \
            || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
          sandboxed bash "$work/scripts/test-skill-examples.sh" 2>&1 | tee "$RUNNER_TEMP/examples.log" \
            || echo "EXAMPLES_FAILED=1" >> "$GITHUB_ENV"
          sudo pkill -KILL -u sandbox || true
      - if: matrix.trust == 'low'
        run: scripts/bump-pinned.sh
      # The pipe deliberately masks validate's exit code (no pipefail): the PR must be opened even on
      # a structural problem; the next step turns any ✗ line into a failed `validate-pr` status.
      - name: Validate (injection hits surface in the PR body)
        run: python3 scripts/validate.py --diff HEAD --warn-only | tee "$RUNNER_TEMP/validate.log"
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            if [ "${SYNC_FAILED:-0}" = 1 ]; then
              # Nothing to put in a PR, so fail the run: that is what sends the notification.
              echo "::error::${{ matrix.trust }}-trust sync failed and nothing else changed:"
              grep '^error:' "$RUNNER_TEMP/sync.log" || true
              exit 1
            fi
            echo "No ${{ matrix.trust }}-trust changes."
            gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | xargs -r gh pr close --delete-branch || true
            exit 0
          fi
          shas=$(jq -r 'to_entries | map(select(.value.trust=="${{ matrix.trust }}") | "\(.key)@\(.value.sha[0:7])") | join(", ")' UPSTREAM.lock.json)
          changed=$(git status --porcelain | wc -l)
          # validator lines quote upstream text (file names, skill names): drop backticks so it cannot close the fence
          hits=$(grep -E '^(‼|⚠|✗)' "$RUNNER_TEMP/validate.log" | tr '\140' "'" || true)
          [ -n "$hits" ] || hits='validator: no hits in added lines'
          # grep -c prints 0 but exits 1 on no match, which `bash -e` would treat as failure;
          # only a real grep error (exit 2) aborts the step.
          high=$(grep -c '\[high\]' "$RUNNER_TEMP/validate.log" || [ $? -eq 1 ])
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync ${{ matrix.trust }}-trust upstream skills ($shas)"
          gh auth setup-git  # git asks gh for GH_TOKEN at push time; the token never lands on disk
          git push --force -u origin "$BRANCH"
          title="chore: ${{ matrix.trust }}-trust upstream sync"
          [ "$high" -eq 0 ] || title="$title ($high high-severity hit(s))"
          # A failed source, failing tests or skill examples go on top of the PR, in the title and in the status.
          # printf -v, not $(...): command substitution would strip the blank line after each section.
          problems='' part=''
          fence=$(printf '\140\140\140')
          if [ "${SYNC_FAILED:-0}" = 1 ]; then
            printf -v part '### Sync failure\n\nThese sources were not updated (see README, "How syncing works"):\n\n%s\n%s\n%s\n\n' \
              "$fence" "$(grep '^error:' "$RUNNER_TEMP/sync.log" || echo 'see the sync step log')" "$fence"
            problems+=$part
          fi
          if [ "${TESTS_FAILED:-0}" = 1 ]; then
            # Test output quotes the synced content: drop its backticks so it cannot close the fence.
            printf -v part '### Repo tests failed\n\n%s\n%s\n%s\n\n' \
              "$fence" "$(tail -n 40 "$RUNNER_TEMP/tests.log" | tr '\140' "'")" "$fence"
            problems+=$part
          fi
          if [ "${EXAMPLES_FAILED:-0}" = 1 ]; then
            # The log is upstream output: drop its backticks so it cannot close the fence.
            printf -v part '### Skill example tests failed\n\n%s\n%s\n%s\n\n' \
              "$fence" "$(tail -n 40 "$RUNNER_TEMP/examples.log" | tr '\140' "'")" "$fence"
            problems+=$part
          fi
          [ -z "$problems" ] || title="$title (sync/test failure)"
          body=$(printf '%s## %s-trust upstream changes — review before merging\n\n%s files changed. Sources: %s\n\nThe validator scanned only the lines this sync adds. `[high]` = instruction-shaped text, exfiltration channel, credential access, remote code execution or a new hook: read that line in context before merging. `[low]` = worth a glance.\n\n```\n%s\n```\n\nSee SECURITY.md for the review checklist.\n' "$problems" "${{ matrix.trust }}" "$changed" "$shas" "$hits")
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body" --label upstream-sync || \
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
          # Satisfy the required `validate-pr` check: structural problems (✗) fail it, injection
          # hits only annotate the PR body — merging with hits is the reviewer's call. Posted only
          # after the PR exists so a failed create never leaves a green context on a PR-less branch.
          state=success; grep -q '^✗' "$RUNNER_TEMP/validate.log" && state=failure
          [ -z "$problems" ] || state=failure
          gh api -X POST "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=validate-pr -f description="validated by sync job ($high high-severity hit(s) in PR body)"
          # GITHUB_TOKEN-created PRs start no pull_request_target run, so report `attribution-guard`
          # here too, from the same patterns, over this commit's message, author and the PR text.
          ag=success
          { git log -1 --format='%B%nauthor: %ae'; printf '%s\n%s\n' "$title" "$body"; } \
            | sh tools/attribution-guard/attribution-guard.sh check >/dev/null || ag=failure
          gh api -X POST "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$ag" -f context=attribution-guard -f description="checked by sync job"
