name: Sync upstream skills

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["plugins/**", ".claude-plugin/**", "scripts/**", "sources.json"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  # Human PRs: structural checks, and any high-severity injection pattern in lines
  # added by the PR fails the check (exit 2) so it cannot be merged unnoticed.
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/validate.py --diff "origin/${{ github.base_ref }}"
      - name: Claude Code manifest validation
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          "$HOME/.local/bin/claude" plugin validate .

  # Every upstream tier lands as a pull request; nothing is pushed to main by automation.
  # The validator scans only the lines this sync adds and puts its hits in the PR body,
  # so the reviewer sees exactly what changed and what looked instruction-shaped.
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trust: [high, low]
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: sync/${{ matrix.trust }}-trust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - run: scripts/sync.sh --trust ${{ matrix.trust }}
      - if: matrix.trust == 'low'
        run: scripts/bump-pinned.sh
      - name: Validate (injection hits surface in the PR body)
        run: python3 scripts/validate.py --diff HEAD --warn-only | tee "$RUNNER_TEMP/validate.log"
      - name: Open or update PR
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No ${{ matrix.trust }}-trust changes."
            gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | xargs -r gh pr close --delete-branch || true
            exit 0
          fi
          shas=$(jq -r 'to_entries | map(select(.value.trust=="${{ matrix.trust }}") | "\(.key)@\(.value.sha[0:7])") | join(", ")' UPSTREAM.lock.json)
          changed=$(git status --porcelain | wc -l)
          hits=$(grep -E '^(‼|⚠|✗)' "$RUNNER_TEMP/validate.log" || echo 'validator: no hits in added lines')
          high=$(grep -c '\[high\]' "$RUNNER_TEMP/validate.log" || true)
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync ${{ matrix.trust }}-trust upstream skills ($shas)"
          git push --force -u origin "$BRANCH"
          title="chore: ${{ matrix.trust }}-trust upstream sync"
          [ "$high" -eq 0 ] || title="$title ($high high-severity hit(s))"
          body=$(printf '## %s-trust upstream changes — review before merging\n\n%s files changed. Sources: %s\n\nThe validator scanned only the lines this sync adds. `[high]` = instruction-shaped text, exfiltration channel, credential access, remote code execution or a new hook: read that line in context before merging. `[low]` = worth a glance.\n\n```\n%s\n```\n\nSee SECURITY.md for the review checklist.\n' "${{ matrix.trust }}" "$changed" "$shas" "$hits")
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body" --label upstream-sync || \
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
