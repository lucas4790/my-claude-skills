name: Release

# Runs when the owner pushes a tag vMAJOR.MINOR.PATCH. The tag must sit on main, match
# metadata.version in .claude-plugin/marketplace.json and have a section in CHANGELOG.md; then the same
# checks as a pull request run, and the changelog section becomes the GitHub release notes.
# Tags are created by the owner (AGENTS.md): this workflow never creates one.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write  # gh release create

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag, version and changelog agree
        run: |
          ver=${GITHUB_REF_NAME#v}
          have=$(jq -r '.metadata.version // empty' .claude-plugin/marketplace.json)
          [ "$have" = "$ver" ] || { echo "::error::tag $GITHUB_REF_NAME but marketplace.json metadata.version is '$have'"; exit 1; }
          grep -qxF "## [$ver]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$ver]' section"; exit 1; }
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - run: python3 scripts/validate.py
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bats python3-pytest python3-yaml yamllint git-filter-repo
          pwsh -NoProfile -Command 'Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
            if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }'
      - name: Script tests
        env:
          SKILL_EXAMPLES_REQUIRE_TOOLS: "1"
        run: scripts/run-tests.sh
      - name: Skill examples
        env:
          SKILL_EXAMPLES_REQUIRE_TOOLS: "1"
        run: scripts/test-skill-examples.sh
      - name: Attribution guard tests
        run: |
          sh tools/attribution-guard/tests/run-tests.sh
          python3 tools/attribution-guard/azure-devops/gen.py --check
          bash tools/attribution-guard/azure-devops/tests/run-tests.sh
          bash tools/attribution-guard/azure-devops/tests/run-dispatch-tests.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v h="## [$ver]" '$0 == h {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || printf 'See CHANGELOG.md.\n' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
